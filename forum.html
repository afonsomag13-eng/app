<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum do Jogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <div class="max-w-2xl mx-auto">
    <!-- Cabeçalho -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Discussão</h1>
      <div id="user-info" class="text-sm text-gray-600"></div>
    </div>

    <!-- ÁREA DE LOGIN / REGISTO -->
    <div id="auth-section" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
      <h2 class="text-xl font-bold mb-4">Entrar ou Criar Conta</h2>
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="flex gap-4 pt-2">
          <button type="button" onclick="signIn()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium">Entrar</button>
          <button type="button" onclick="signUp()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 font-medium">Criar Conta</button>
        </div>
        <p id="auth-message" class="text-sm text-red-500 mt-2"></p>
      </form>
    </div>

    <!-- ÁREA DO FÓRUM (Só aparece depois de logado) -->
    <div id="forum-section" class="hidden">
      <!-- Formulário de Novo Tópico -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
        <h2 class="text-xl font-bold mb-4">Novo Tópico</h2>
        <input type="text" id="topic-title" placeholder="Título do tópico" class="w-full border border-gray-300 rounded-lg p-2 mb-3">
        <textarea id="topic-content" placeholder="O que queres discutir?" rows="3" class="w-full border border-gray-300 rounded-lg p-2 mb-3"></textarea>
        <button onclick="createTopic()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium">Publicar Tópico</button>
      </div>

      <!-- Lista de Tópicos -->
      <div id="topics-list" class="space-y-4"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURAÇÃO DO SUPABASE (SUBSTITUI AQUI)
    // ==========================================
    const SUPABASE_URL = 'https://pdwqkggpkwxmevthoyvm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkd3FrZ2dwa3d4bWV2dGhveXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTg4NjAsImV4cCI6MjEwOTA5NDg2MH0.K0Il6pXv3xewGpe0_TInh-YIm411cE1DgZhMECYMfAk';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. LÓGICA DE AUTENTICAÇÃO
    // ==========================================
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await db.auth.signUp({ email, password });
      const msg = document.getElementById('auth-message');
      if (error) { msg.textContent = error.message; return; }
      msg.textContent = 'Conta criada! Verifica o teu email se necessário.';
      msg.className = 'text-sm text-green-600 mt-2';
      // Se as confirmações de email estiverem desativadas no Supabase, a sessão já fica ativa
      if(data.session) { window.location.reload(); } 
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      const msg = document.getElementById('auth-message');
      if (error) { msg.textContent = error.message; return; }
      window.location.reload(); // Recarrega para mostrar o fórum
    }

    async function signOut() {
      await db.auth.signOut();
      window.location.reload();
    }

    // ==========================================
    // 3. VERIFICAR SE O UTILIZADOR ESTÁ LOGADO
    // ==========================================
    db.auth.onAuthStateChange((event, session) => {
      const authSection = document.getElementById('auth-section');
      const forumSection = document.getElementById('forum-section');
      const userInfo = document.getElementById('user-info');

      if (session) {
        // Está logado
        authSection.classList.add('hidden');
        forumSection.classList.remove('hidden');
        userInfo.innerHTML = `
          <span>Olá, ${session.user.email}</span>
          <button onclick="signOut()" class="text-red-500 ml-3 hover:underline">Sair</button>
        `;
        loadTopics();
      } else {
        // Não está logado
        authSection.classList.remove('hidden');
        forumSection.classList.add('hidden');
        userInfo.innerHTML = '';
      }
    });

    // ==========================================
    // 4. LÓGICA DO FÓRUM (LER E CRIAR TÓPICOS)
    // ==========================================
    async function createTopic() {
      const title = document.getElementById('topic-title').value;
      const content = document.getElementById('topic-content').value;
      if (!title || !content) return alert('Preenche o título e o conteúdo!');

      const user = await db.auth.getUser();
      
      const { error } = await db.from('topics').insert({
        title: title,
        content: content,
        author_name: user.data.user.email,
        user_id: user.data.user.id
      });

      if (error) { alert('Erro ao publicar: ' + error.message); return; }
      
      // Limpar os campos
      document.getElementById('topic-title').value = '';
      document.getElementById('topic-content').value = '';
    }

    async function loadTopics() {
      const { data, error } = await db
        .from('topics')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) { console.error(error); return; }

      const list = document.getElementById('topics-list');
      list.innerHTML = '';
      
      if (data.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-center">Ainda não há tópicos. Sê o primeiro!</p>';
        return;
      }

      data.forEach(topic => {
        list.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
            <h3 class="font-bold text-lg text-gray-800">${topic.title}</h3>
            <p class="text-xs text-gray-400 mb-2">Por ${topic.author_name}</p>
            <p class="text-gray-600">${topic.content}</p>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
