<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Meu Jogo - Fórum</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Ícones -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

  <!-- BARRA DE NAVEGAÇÃO -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
          <div class="bg-blue-600 p-2 rounded-lg text-white">
            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
          </div>
          <span class="font-bold text-xl tracking-tight">O Meu Jogo</span>
        </div>
        <div id="nav-user-info" class="text-sm text-gray-600"></div>
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
    
    <!-- VISTA 1: PÁGINA INICIAL (Deslogado) -->
    <div id="view-landing" class="text-center py-12">
      <h1 class="text-5xl font-extrabold text-gray-900 tracking-tight mb-4">Bem-vindo ao Jogo</h1>
      <p class="text-lg text-gray-500 max-w-2xl mx-auto mb-8">
        Entra na nossa comunidade para discutir teorias, partilhar ideias e falar sobre o desenvolvimento do jogo.
      </p>
      
      <!-- Caixa de Login -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-md mx-auto text-left">
        <h2 class="text-xl font-bold mb-4">Entrar ou Criar Conta</h2>
        <form id="auth-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" onclick="signIn()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium transition">Entrar</button>
            <button type="button" onclick="signUp()" class="w-full bg-gray-100 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-200 font-medium transition">Criar Conta</button>
          </div>
          <p id="auth-message" class="text-sm mt-2 text-center"></p>
        </form>
      </div>
    </div>

    <!-- VISTA 2: FÓRUM (Logado) -->
    <div id="view-forum" class="hidden">
      <div class="flex justify-between items-end mb-6 border-b pb-4">
        <h2 class="text-3xl font-bold text-gray-900">Discussão da Comunidade</h2>
        <button onclick="signOut()" class="text-red-500 text-sm hover:underline">Terminar Sessão</button>
      </div>

      <!-- Criar Novo Tópico -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
        <h3 class="font-bold mb-3 text-lg">Criar Novo Tópico</h3>
        <input type="text" id="topic-title" placeholder="Título (ex: Ideias para o nível 1)" class="w-full border border-gray-300 rounded-lg p-2 mb-3">
        <textarea id="topic-content" placeholder="Escreve aqui a tua mensagem..." rows="3" class="w-full border border-gray-300 rounded-lg p-2 mb-3"></textarea>
        <button onclick="createTopic()" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 font-medium transition">Publicar Tópico</button>
      </div>

      <!-- Lista de Tópicos -->
      <div id="topics-list" class="space-y-4"></div>
    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="bg-white border-t border-gray-200 py-6 mt-auto">
    <div class="max-w-5xl mx-auto px-4 text-center text-sm text-gray-400">
      &copy; 2026 O Meu Jogo. Todos os direitos reservados.
    </div>
  </footer>

  <script>
    lucide.createIcons();

    // ==========================================
    // 1. CONFIGURAÇÃO DO SUPABASE (Mantém as tuas chaves aqui)
    // ==========================================
    const SUPABASE_URL = 'COLOCA_AQUI_O_TEU_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'COLOCA_AQUI_A_TUA_ANON_KEY';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. LÓGICA DE AUTENTICAÇÃO
    // ==========================================
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('auth-message');
      
      const { data, error } = await db.auth.signUp({ email, password });
      
      if (error) { 
        msg.textContent = error.message; 
        msg.className = 'text-sm mt-2 text-center text-red-500';
        return; 
      }
      
      msg.textContent = 'Conta criada com sucesso!';
      msg.className = 'text-sm mt-2 text-center text-green-600';
      
      // Se a confirmação de email estiver desligada, ele já loga sozinho
      if(data.session) { 
        checkUser(); 
      } 
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('auth-message');
      
      const { error } = await db.auth.signInWithPassword({ email, password });
      
      if (error) { 
        msg.textContent = error.message; 
        msg.className = 'text-sm mt-2 text-center text-red-500';
        return; 
      }
      
      checkUser();
    }

    async function signOut() {
      await db.auth.signOut();
      checkUser();
    }

    // ==========================================
    // 3. ALTERNAR ENTRE AS VISTAS (Landing vs Fórum)
    // ==========================================
    async function checkUser() {
      const { data: { session } } = await db.auth.getSession();
      
      const viewLanding = document.getElementById('view-landing');
      const viewForum = document.getElementById('view-forum');
      const navInfo = document.getElementById('nav-user-info');

      if (session) {
        // Está logado: mostra o fórum
        viewLanding.classList.add('hidden');
        viewForum.classList.remove('hidden');
        navInfo.innerHTML = `<span>Olá, <b>${session.user.email.split('@')[0]}</b></span>`;
        loadTopics();
      } else {
        // Não está logado: mostra a página inicial
        viewLanding.classList.remove('hidden');
        viewForum.classList.add('hidden');
        navInfo.innerHTML = '';
        document.getElementById('auth-message').textContent = ''; // limpa erros antigos
      }
    }

    // Verifica o estado assim que a página abre
    checkUser();

    // ==========================================
    // 4. LÓGICA DO FÓRUM
    // ==========================================
    async function createTopic() {
      const title = document.getElementById('topic-title').value;
      const content = document.getElementById('topic-content').value;
      
      if (!title || !content) return alert('Preenche o título e o conteúdo!');

      const { data: { user } } = await db.auth.getUser();
      
      const { error } = await db.from('topics').insert({
        title: title,
        content: content,
        author_name: user.email,
        user_id: user.id
      });

      if (error) { 
        alert('Erro ao publicar: ' + error.message); 
        return; 
      }
      
      // Limpar os campos
      document.getElementById('topic-title').value = '';
      document.getElementById('topic-content').value = '';
      loadTopics(); // Recarrega a lista
    }

    async function loadTopics() {
      const { data, error } = await db
        .from('topics')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) { console.error(error); return; }

      const list = document.getElementById('topics-list');
      list.innerHTML = '';
      
      if (data.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-center py-4 bg-white rounded-xl border">Ainda não há tópicos. Sê o primeiro a falar!</p>';
        return;
      }

      data.forEach(topic => {
        const date = new Date(topic.created_at).toLocaleDateString('pt-PT');
        list.innerHTML += `
          <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-lg text-gray-900">${topic.title}</h3>
            <p class="text-xs text-gray-400 mb-3">Por ${topic.author_name} em ${date}</p>
            <p class="text-gray-700">${topic.content}</p>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
